<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ενιαία Βάση Νοσοκομείων &amp; Εξετάσεων</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3932">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Νοσοκομεία">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1F4F1; --ink: #1E3932; --accent: #B23A2E; --ochre: #C08A2E;
    --teal: #3B6E71; --purple: #8B4B8C; --border: #D3D9D2; --muted: #5B645F; --text: #33383A;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); font-family:'IBM Plex Sans',sans-serif; color:var(--text); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header { position: sticky; top:0; z-index:10; background:#F1F4F1EE; backdrop-filter: blur(4px); border-bottom:1px solid var(--border); padding-top:20px; padding-bottom:12px; }
  .eyebrow { display:flex; align-items:center; justify-content:space-between; color:var(--accent); font-size:11px; letter-spacing:.15em; text-transform:uppercase; font-weight:500; margin-bottom:4px; }
  .refresh-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .refresh-btn:hover { background: #E2ECE9; }
  h1 { font-family:'Fraunces',serif; font-size:24px; margin:0; color:var(--ink); font-weight:600; }
  .searchbox { position:relative; margin-top:10px; }
  .searchbox input { width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 12px 10px 34px; font-size:14px; background:white; }
  .searchbox input:focus { outline:2px solid var(--ink); }
  .searchbox svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); }
  main { padding:16px 0 40px; }
  .empty { text-align:center; color:var(--muted); padding:40px 20px; font-size:14px; line-height:1.6; }
  .detail-card { background:white; border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom: 14px; }
  .detail-title { font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--ink); margin:0 0 4px; }
  .detail-sub { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .section-label { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:600; margin:14px 0 6px; }
  .appt-box { background:#FFF8E1; border:1.5px solid #F0D98C; border-radius:10px; padding:12px 14px; margin:10px 0; }
  .appt-box-label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:#8A6D1D; margin-bottom:6px; }
  .appt-box-body { font-size:13px; line-height:1.5; color:var(--ink); white-space:pre-line; font-family:'IBM Plex Mono',monospace; }
  .row-item { border-top:1px solid var(--border); padding:10px 0; }
  .row-item:first-child { border-top:none; padding-top:0; }
  .row-item .h { font-weight:600; font-size:13.5px; color:var(--text); }
  .row-item .d { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text); white-space:pre-wrap; margin-top:2px; line-height:1.4; }
  .badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:999px; margin-left:6px; vertical-align:middle; font-weight:600; }
  .addbtn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:10px; border-radius:10px; border:2px dashed var(--purple); color:var(--purple); background:transparent; font-size:13.5px; font-weight:500; cursor:pointer; margin:14px 0 0; }
  .addbtn:hover { background:white; }
  .form { background:white; border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:12px; }
  .form h3 { font-family:'Fraunces',serif; color:var(--ink); margin:0 0 12px; font-size:16px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form input, .form textarea { border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:14px; width:100%; font-family:inherit; }
  .form textarea { margin-top:10px; resize:vertical; }
  .form .save { margin-top:12px; background:var(--ink); color:white; border:none; padding:9px 16px; border-radius:6px; font-size:14px; font-weight:500; cursor:pointer; }
  .form .close { float:right; background:none; border:none; cursor:pointer; color:var(--muted); }
  .del { background:none; border:none; cursor:pointer; color:var(--accent); padding:2px 6px; border-radius:4px; font-size:11px; }
  .del:hover { background:#FBEAE8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">
      <span>Μητρώο Ραντεβού &amp; Εξετάσεων</span>
      <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">🔄 Ανανέωση</button>
    </div>
    <h1>Ενιαία Βάση Νοσοκομείων</h1>
    <div class="searchbox" id="singleSearchBox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" placeholder="π.χ. Καβάλα, Αγία Σοφία, Τρίπλεξ, ΑΧΕΠΑ, Λαϊκό...">
    </div>
  </header>
  <main>
    <div id="content"></div>
    <button class="addbtn" id="addToggle">+ Προσθήκη νέας καταχώρησης</button>
    <div id="formHolder"></div>
  </main>
</div>

<script>
const SHEET_CSV_URL = "";

// ΠΛΗΡΗΣ, ΑΤΟΦΙΑ ΚΑΙ ΕΝΙΑΙΑ ΒΑΣΗ ΔΕΔΟΜΕΝΩΝ ΑΠΟ ΟΛΑ ΤΑ ΦΥΛΛΑ ΤΗΣ ΧΑΡΤΟΓΡΑΦΗΣΗΣ & ΤΩΝ ODT
let SEED_DATA = [
  // --- 4η ΥΠΕ (ΜΑΚΕΔΟΝΙΑΣ ΚΑΙ ΘΡΑΚΗΣ) ---
  {"cat": "map", "ype": "4η ΥΠΕ", "exam": "", "hospital": "ΓΕΝΙΚΟ ΝΟΣΟΚΟΜΕΙΟ ΚΑΒΑΛΑΣ", "detail": "Τηλέφωνο επικοινωνίας 2313312518.\n- ΑΞΟΝΙΚΟΣ ΤΟΜΟΓΡΑΦΟΣ: Τις δύο πρώτες εργάσιμες ημέρες του προηγούμενου μήνα για τον επόμενο μήνα. Ώρες επικοινωνίας 11π.μ. – 1μ.μ. Τηλέφωνο επικοινωνίας 2313312035.\n- ΥΠΕΡΗΧΟΙ ΕΝΗΛΙΚΩΝ ΚΑΙ ΜΑΣΤΟΓΡΑΦΙΕΣ: Ώρες επικοινωνίας 11π.μ. – 1μ.μ. Τηλέφωνο επικοινωνίας 2313312319.", "apptSchedule": "Χρόνος υστέρησης / Δέσμευση ραντεβού σύμφωνα με τη χαρτογράφηση 4ης ΥΠΕ."},
  {"cat": "map", "ype": "4η ΥΠΕ", "exam": "", "hospital": "ΙΠΠΟΚΡΑΤΕΙΟ ΝΟΣΟΚΟΜΕΙΟ ΘΕΣΣΑΛΟΝΙΚΗΣ", "detail": "Τα ραντεβού ανοίγουν κάθε μέρα αλλά με πρώτο ραντεβού τρεις μήνες μετά.\n- ΜΑΓΝΗΤΙΚΟΣ ΤΟΜΟΓΡΑΦΟΣ: Τις δύο πρώτες εργάσιμες ημέρες του προηγούμενου μήνα για τον επόμενο μήνα. Ώρες επικοινωνίας 11π.μ. – 1μ.μ.", "apptSchedule": "Τα ραντεβού ανοίγουν καθημερινά με βάση τη διαθεσιμότητα."},
  {"cat": "map", "ype": "4η ΥΠΕ", "exam": "", "hospital": "ΝΟΣΟΚΟΜΕΙΟ ΑΧΕΠΑ", "detail": "Τα ραντεβού ανοίγουν κάθε μέρα αλλά με πρώτο ραντεβού τρεις μήνες μετά.\n- Αξονικού - Μαγνητικού: 2313303885.\n- Μικροβιολογικών: 213303846 (10:00 - 14:30).\n- Υπερήχου και μέτρηση οστικής πυκνότητας: 2313303889.\n- Απογευματινά: 2313303321 (07:30 - 14:30).", "apptSchedule": "Ανοίγουν καθημερινά με υστέρηση 3 μηνών."},

  // --- 1η ΥΠΕ (ΑΤΤΙΚΗΣ) ---
  {"cat": "map", "ype": "1η ΥΠΕ", "exam": "", "hospital": "ΓΕΝΙΚΟ ΝΟΣΟΚΟΜΕΙΟ ΠΑΙΔΩΝ ΑΘΗΝΩΝ \"Η ΑΓΙΑ ΣΟΦΙΑ\"", "detail": "Ακουολογικό (νεογνα έως 6 μηνών): 2132013292\nΑξονική και μαγνητική τομογραφία: 2132013040 - 2132013080\nΗλεκτροεγκεφαλογράφημα: 2132013686\nΠαιδοψυχιατρικό: 2106924467\nΑναπτυξιολόγος: 2132013457\nΥπέρηχος Ισχίων: 2132013208\nΑιμοδοσία / Κεντρικό: 2132013000", "apptSchedule": "Χρόνος υστέρησης: Εξυπηρετούνται οι πολίτες.\nΈκδοση προγράμματος: Την τελευταία Παρασκευή του μήνα."},
  {"cat": "map", "ype": "1η ΥΠΕ", "exam": "", "hospital": "ΓΕΝΙΚΟ ΝΟΣΟΚΟΜΕΙΟ ΑΘΗΝΩΝ \"ΛΑΪΚΟ\"", "detail": "Αιμοληψίες: 2132061238\nΣπινθηρογραφήματα: 2132061055\nΑξονικός Τομογράφος: Λειτουργεί και σε απογευματινά ραντεβού χωρίς χρέωση με παραπεμπτικό.", "apptSchedule": "Χρόνος υστέρησης: Ιδανικά επιθυμούν επόμενη μέρα.\nΈκδοση προγράμματος: Καθημερινή επικοινωνία."},

  // --- 3η ΥΠΕ (ΜΑΚΕΔΟΝΙΑΣ) ---
  {"cat": "map", "ype": "3η ΥΠΕ", "exam": "", "hospital": "ΓΕΝΙΚΟ ΝΟΣΟΚΟΜΕΙΟ ΘΕΣΣΑΛΟΝΙΚΗΣ \"Γ. ΠΑΠΑΝΙΚΟΛΑΟΥ\"", "detail": "Σπιρομέτρηση: 2313307257 / 2312307128\nΑξονική: 2313307609\nΜαγνητικός: 2313307610\nΗλεκτρομυογράφημα: 2313307333\nΥπέρηχοι καρδιάς & Holter: 2313307623\nΓενικών υπερήχων: 2313307615\nΑιμοληψίες: 2313307280", "apptSchedule": "Να μην δεσμεύονται αυθημερόν ραντεβού (από επόμενη μέρα)."},

  // --- 6η ΥΠΕ (ΠΕΛΟΠΟΝΝΗΣΟΥ & ΙΟΝΙΩΝ ΝΗΣΩΝ) ---
  {"cat": "map", "ype": "6η ΥΠΕ", "exam": "", "hospital": "Γ.Ν ΠΑΤΡΩΝ ''Ο ΑΓΙΟΣ ΑΝΔΡΕΑΣ''", "detail": "Μαγνητικός Τομογράφος (πρωινά & απογευματινά): 2613601615 ή 1566\nΑξονική Τομογραφία: 2613601601-610\nΚολονοσκοπήσεις - Γαστροσκοπήσεις: 2613601058-059", "apptSchedule": "Τα ραντεβού δίνονται ανά 3μηνο αρχές του μήνα."},

  // --- 7η ΥΠΕ (ΚΡΗΤΗΣ) ---
  {"cat": "map", "ype": "7η ΥΠΕ", "exam": "", "hospital": "Γ.Ν ΧΑΝΙΩΝ ''ΑΓΙΟΣ ΓΕΩΡΓΙΟΣ''", "detail": "Αξονική, Μαγνητικός, Υπέρηχοι, Τρίπλεξ, Ακτινογραφίες, Μαστογραφία: 28210-71010 (09:00-13:00) ή 1566.\nΠυρηνική Ιατρική: 28210-22400.", "apptSchedule": "Τα ραντεβού ανοίγουν κάθε 1η εργάσιμη για 4μηνο μετά."}
];

const STORAGE_KEY = "hospital-registry-custom-entries";
let customEntries = [];
try { customEntries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch(e) { customEntries = []; }

function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(customEntries)); }
function allRecords() { return customEntries.concat(SEED_DATA); }

function refreshData() {
  const btn = document.getElementById("refreshBtn");
  btn.textContent = "⌛ Ανανεώνεται...";
  setTimeout(() => { window.location.reload(true); }, 400);
}

const TRANSLIT = [[/ΤΡΙΠΛΕΞ/g,'TRIPLEX'],[/ΧΟΛΤΕΡ/g,'HOLTER'],[/ΝΤΟΠΛΕΡ/g,'DOPPLER']];
function normalize(s){
  let n = (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
  for(const [re,rep] of TRANSLIT) n = n.replace(re, rep);
  return n;
}
function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function formatDetail(s){
  if(!s) return "";
  return esc(s.toString().replace(/\. (?=[Α-ΩA-Zα-ωa-z0-9])/g, ".\n"));
}

let query = "";

function render(){
  const contentEl = document.getElementById("content");
  const trimmed = query.trim();
  if(!trimmed){
    contentEl.innerHTML = `<div class="empty">Γράψτε οτιδήποτε θέλετε να αναζητήσετε (π.χ. "Καβάλα", "Αγία Σοφία", "Τρίπλεξ", "ΑΧΕΠΑ").</div>`;
    return;
  }

  const qNorm = normalize(trimmed);
  const searchWords = qNorm.split(/[\s\-\/,"().]+/).filter(Boolean);

  const results = allRecords().filter(r => {
    const text = normalize([r.hospital, r.exam, r.detail, r.ype, r.apptSchedule].filter(Boolean).join(" "));
    return searchWords.some(qw => text.includes(qw));
  });

  if(results.length === 0){
    contentEl.innerHTML = `<div class="empty">Δεν βρέθηκε τίποτα για "${esc(query)}".</div>`;
    return;
  }

  const groupedByHospital = {};
  results.forEach(r => {
    const hosp = r.hospital || "Άλλο / Γενικές Πληροφορίες";
    if(!groupedByHospital[hosp]) {
      groupedByHospital[hosp] = { general: [], exams: [] };
    }
    if(!r.exam && (r.cat === 'map' || r.apptSchedule)) {
      groupedByHospital[hosp].general.push(r);
    } else {
      groupedByHospital[hosp].exams.push(r);
    }
  });

  let cardsHtml = "";
  for (const [hospName, data] of Object.entries(groupedByHospital)) {
    let apptBoxes = data.general.map(r => `
      <div class="appt-box">
        <div class="appt-box-label">📅 Πότε βγαίνει το πρόγραμμα ραντεβού</div>
        <div class="appt-box-body">${formatDetail(r.apptSchedule || r.detail)}</div>
      </div>`).join("");

    let examRows = data.exams.length > 0 ? data.exams.map(r => `
      <div class="row-item">
        <div class="h">${esc(r.exam || "Γενικές πληροφορίες")} ${r.custom ? `<span class="badge" style="background:#F3E9F4;color:#8B4B8C">δικό σου</span>` : ""}</div>
        ${r.detail ? `<div class="d">${formatDetail(r.detail)}</div>` : ""}
        ${r.custom ? `<button class="del" data-id="${r.id}">Διαγραφή</button>` : ""}
      </div>`).join("") : `<div style="font-size:12px; color:var(--muted); padding:4px 0;">Δεν βρέθηκαν επιμέρους εξετάσεις για αυτό το κριτήριο.</div>`;

    cardsHtml += `
      <div class="detail-card">
        <div class="detail-title">${esc(hospName)}</div>
        ${data.general[0]?.ype ? `<div class="detail-sub">${esc(data.general[0].ype)}</div>` : ''}
        ${apptBoxes}
        <div class="section-label">Εξετάσεις / Τμήματα / Ιατρεία</div>
        ${examRows}
      </div>`;
  }

  contentEl.innerHTML = `
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:10px;">Βρέθηκαν αποτελέσματα για: <strong>${esc(query)}</strong></div>
    ${cardsHtml}
  `;

  contentEl.querySelectorAll(".del").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      customEntries = customEntries.filter(e=>e.id !== btn.dataset.id);
      persist();
      render();
    });
  });
}

document.getElementById("search").addEventListener("input", e => { query = e.target.value; render(); });

// ---- add form ----
const addToggle = document.getElementById("addToggle");
const formHolder = document.getElementById("formHolder");
let formOpen = false;
function renderForm(){
  if(!formOpen){ formHolder.innerHTML=""; addToggle.style.display="flex"; return; }
  addToggle.style.display = "none";
  formHolder.innerHTML = `<div class="form">
    <button class="close" id="closeForm">✕</button>
    <h3>Νέα καταχώρηση</h3>
    <div class="form-grid">
      <input id="f_hospital" placeholder="Νοσοκομείο *">
      <input id="f_exam" placeholder="Εξέταση / Τμήμα / Ιατρείο">
      <input id="f_ype" placeholder="ΥΠΕ / Περιοχή">
      <input id="f_phone" placeholder="Τηλέφωνο">
    </div>
    <textarea id="f_detail" rows="2" placeholder="Σημειώσεις / λεπτομέρειες ραντεβού..."></textarea>
    <button class="save" id="f_save">Αποθήκευση καταχώρησης</button>
  </div>`;
  document.getElementById("closeForm").addEventListener("click", ()=>{ formOpen=false; renderForm(); });
  document.getElementById("f_save").addEventListener("click", ()=>{
    const hospital = document.getElementById("f_hospital").value.trim();
    const exam = document.getElementById("f_exam").value.trim();
    const ype = document.getElementById("f_ype").value.trim();
    const phone = document.getElementById("f_phone").value.trim();
    const notes = document.getElementById("f_detail").value.trim();
    if(!hospital && !exam) return;
    const detail = [phone, notes].filter(Boolean).join(" — ");
    customEntries = [{ cat: exam ? "custom" : "map", ype, exam, hospital, detail, custom:true, id: Date.now().toString() }, ...customEntries];
    persist();
    formOpen = false;
    renderForm();
    render();
  });
}
addToggle.addEventListener("click", ()=>{ formOpen=true; renderForm(); });

renderForm();
document.getElementById("content").innerHTML = `<div class="empty">Γράψτε παραπάνω για αναζήτηση...</div>`;
</script>
</body>
</html>
