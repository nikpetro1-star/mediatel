<style>
  :root {
    --paper: #F1F4F1; --ink: #1E3932; --accent: #B23A2E; --ochre: #C08A2E;
    --teal: #3B6E71; --purple: #8B4B8C; --border: #D3D9D2; --muted: #5B645F; --text: #33383A;
  }
  * { box-sizing: border-box; }
  html { background:#F5F6F4; }
  body {
    margin:0; font-family:'IBM Plex Sans',sans-serif; color:var(--text);
    min-height:100vh;
    background-color:#F5F6F4;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(59,110,113,0.30), transparent 42%),
      radial-gradient(circle at 92% 10%, rgba(178,58,46,0.22), transparent 38%),
      radial-gradient(circle at 50% 100%, rgba(192,138,46,0.18), transparent 45%),
      radial-gradient(circle at 1px 1px, #E7EBE6 1.5px, transparent 0);
    background-size: 100% 100%, 100% 100%, 100% 100%, 22px 22px;
    background-repeat: no-repeat, no-repeat, no-repeat, repeat;
    background-attachment: fixed, fixed, fixed, local;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 6px; }
  header { position: sticky; top:0; z-index:10; background:#F1F4F1EE; backdrop-filter: blur(4px); border-bottom:1px solid var(--border); padding-top:20px; padding-bottom:12px; }
  .eyebrow { display:flex; align-items:center; gap:6px; color:var(--accent); font-size:11px; letter-spacing:.15em; text-transform:uppercase; font-weight:500; margin-bottom:4px; }
  h1 { font-family:'Fraunces',serif; font-size:24px; margin:0; color:var(--ink); font-weight:600; }
  .modes { display:flex; gap:8px; margin-top:14px; }
  .mode { flex:1; padding:10px; border-radius:10px; border:2px solid var(--border); background:white; font-size:13.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; color:var(--text); }
  .mode.active.exam { border-color:var(--teal); background:var(--teal); color:white; }
  .mode.active.hospital { border-color:var(--ink); background:var(--ink); color:white; }
  .mode.active.combo { border-color:var(--purple); background:var(--purple); color:white; }
  .modes .mode { flex:1; font-size:12.5px; padding:10px 4px; }
  .combo-box { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .combo-box input { border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; background:white; }
  .combo-box input:focus { outline:2px solid var(--purple); }
  .searchbox { position:relative; margin-top:10px; }
  .searchbox input { width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 12px 10px 34px; font-size:14px; background:white; }
  .searchbox input:focus { outline:2px solid var(--ink); }
  .searchbox svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .hero {
    position:relative; margin-top:14px; border-radius:16px; overflow:hidden;
    background:linear-gradient(135deg, #1E3932 0%, #3B6E71 100%);
    padding:18px 16px; display:flex; align-items:center; gap:14px;
  }
  .hero-text { color:#EFF3EF; }
  .hero-text .tag { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:#C9D8D1; font-weight:600; }
  .hero-text .line { font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin-top:2px; line-height:1.3; }
  .hero svg { flex-shrink:0; }
  .wordmark { font-size:38px; font-weight:800; color:#1A1A1A; letter-spacing:-0.8px; margin-top:4px; }
  .wordmark .accent { color:var(--accent); }
  main { padding:16px 0 40px; }
  .suggestions { display:flex; flex-direction:column; gap:6px; }
  .sugg { text-align:left; background:white; border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .sugg:hover { border-color:var(--ink); }
  .sugg .n { color:var(--muted); font-size:12px; font-family:'IBM Plex Mono',monospace; }
  .empty { text-align:center; color:var(--muted); padding:6px 20px 14px; font-size:14px; line-height:1.6; }
  .empty-illus { display:block; margin:0 auto 10px; max-width:260px; width:100%; height:auto; }
  .back { background:none; border:none; color:var(--ink); font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px; margin-bottom:12px; padding:0; }
  .detail-card { background:white; border:1px solid var(--border); border-radius:12px; padding:18px; }
  .detail-title { font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--ink); margin:0 0 4px; }
  .detail-sub { font-size:12.5px; color:var(--muted); margin-bottom:14px; }
  .section-label { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:600; margin:16px 0 8px; }
  .section-label:first-of-type { margin-top:0; }
  .appt-box { background:#DFF6DA; border:1px solid #B7E4AE; border-radius:12px; padding:14px 16px; margin:12px 0; }
  .appt-box-label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:#1f5c12; margin-bottom:8px; }
  .appt-box-body { font-size:14px; line-height:1.5; color:var(--ink); white-space:pre-line; }
  .row-item { border-top:1px solid var(--border); padding:12px 0; }
  .row-item:first-child { border-top:none; padding-top:0; }
  .row-item + .row-item { margin-top:2px; }
  .row-item .h { font-weight:800; font-size:14.5px; color:#000; }
  .row-item .h .ex { font-family:'IBM Plex Sans',sans-serif; font-weight:700; color:#C21F1F; }
  .row-item .d { font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#000; white-space:pre-wrap; margin-top:3px; line-height:1.5; }
  .row-item .d b.ph { font-weight:700; color:#000; }
  .row-item.appt-row { background:#DFF6DA; border:1px solid #B7E4AE; border-radius:12px; padding:12px 14px; margin:8px 0; }
  .row-item.appt-row:first-child { padding-top:12px; }
  .row-item.appt-row .d { font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; }
  .exam-hl { color:var(--accent); font-weight:600; }
  .badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:999px; margin-left:6px; vertical-align:middle; font-weight:600; }
  .addbtn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:10px; border-radius:10px; border:2px dashed var(--purple); color:var(--purple); background:transparent; font-size:13.5px; font-weight:500; cursor:pointer; margin:14px 0 0; }
  .addbtn:hover { background:white; }
  .form { background:white; border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:12px; }
  .form h3 { font-family:'Fraunces',serif; color:var(--ink); margin:0 0 12px; font-size:16px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form input, .form textarea { border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:14px; width:100%; font-family:inherit; }
  .form textarea { margin-top:10px; resize:vertical; }
  .form .save { margin-top:12px; background:var(--ink); color:white; border:none; padding:9px 16px; border-radius:6px; font-size:14px; font-weight:500; cursor:pointer; }
  .form .close { float:right; background:none; border:none; cursor:pointer; color:var(--muted); }
  .del { background:none; border:none; cursor:pointer; color:var(--accent); padding:2px 6px; border-radius:4px; font-size:11px; }
  .del:hover { background:#FBEAE8; }
  .refresh-btn {
    position:fixed; top:14px; right:14px; z-index:20;
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
  }
  .refresh-btn svg { transition: transform .4s ease; }
  .refresh-btn:active svg { transform:rotate(180deg); }
</style>

function parseCSV(text){
  // Minimal RFC4180-ish CSV parser (handles quoted fields with commas/newlines/escaped quotes).
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] && r[0].trim()));
}

function csvRowsToRecords(rows){
  if(rows.length < 2) return [];
  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = (name) => header.indexOf(name);
  const iCat = idx("category"), iYpe = idx("ype"), iExam = idx("exam"), iHosp = idx("hospital"), iDet = idx("detail");
  return rows.slice(1).map(r => ({
    cat: iCat >= 0 ? (r[iCat]||"").trim() : "",
    ype: iYpe >= 0 ? (r[iYpe]||"").trim() : "",
    exam: iExam >= 0 ? (r[iExam]||"").trim() : "",
    hospital: iHosp >= 0 ? (r[iHosp]||"").trim() : "",
    detail: iDet >= 0 ? (r[iDet]||"").trim() : "",
  })).filter(r => r.hospital || r.exam);
}

async function loadSeedData(){
  if(!SHEET_CSV_URL){
    SEED_DATA = BUNDLED_SNAPSHOT;
    return { ok: true, source: "bundled" };
  }
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const records = csvRowsToRecords(parseCSV(text));
    if(records.length === 0) throw new Error("empty sheet");
    SEED_DATA = records;
    return { ok: true, source: "sheet" };
  } catch(e){
    SEED_DATA = BUNDLED_SNAPSHOT;
    return { ok: false, source: "bundled", error: e };
  }
}

const TRANSLIT = [[/ΤΡΙΠΛΕΞ/g,'TRIPLEX'],[/ΧΟΛΤΕΡ/g,'HOLTER'],[/ΝΤΟΠΛΕΡ/g,'DOPPLER'],[/DOOPLER/g,'DOPPLER'],[/TRIPPLEX/g,'TRIPLEX'],[/ΤΡΙΠΠΛΕΞ/g,'TRIPLEX'],[/ΦΛΕΜΙΓΚ/g,'ΦΛΕΜΙΝΓΚ']];
function normalize(s){
  let n = (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
  for(const [re,rep] of TRANSLIT) n = n.replace(re, rep);
  return n;
}
function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
// Highlights clinic/specialty words ANYWHERE inside a block of text (not just the
// "— εξέταση" line in the header): anything ending in -λογικό/-ολόγος/-χειρουργικό/
// -ιατρικό, or the word "ιατρείο" itself, in any case or Greek inflection.
// Curated, specific clinic/specialty word-roots (never collides with ordinary words)
// plus curated standalone exam/procedure names — built from, and checked against,
// every "exam" value actually used across the whole dataset.
const SPECIALTY_STEMS = [
  "λογικ","χειρουργικ","χειρουργεί","ιατρικ","ιατρε[ιί]",
  "(?<!δρομ)(?<!αξι)(?<!απ)ολ[οό]γ","λογοθεραπ","αγγειολογ"
];
const EXAM_WORDS = [
  "triplex","holter","χολτερ","doppler","stress","echo","covid","αντιικ[αά]",
  "τεστ κοπωσ","κοπωσ",
  "αξονικ","μαγνητικ","τομογραφ","υπ[εέ]ρηχ","μαστογραφ","μαστο[υύ]","μαστ[ωώ]ν",
  "σπιρομ[εέ]τρ","εργοσπιρομ[εέ]τρ","αιμοληψ","αιμοδοσ[ιί]","εμβ[οό]λι","πιστοποιητικ[οό] υγ",
  "θυρεοειδ","παραθυρεοειδ","πυκν[οό]τητ","οστε[οό]π[οό]ρωσ",
  "σπινθηρογρ[αά]φ","κολποσκ[οό]π","ενδοσκ[οό]π","γαστροσκ[οό]π","βρογχοσκ[οό]π",
  "κολονοσκ[οό]π","κυστεοσκ[οό]π","σιαλενδοσκ[οό]π","λιθοτριψ[ιί]",
  "ηλεκτροεγκεφαλογρ[αά]φ","εγκεφαλογρ[αά]φ","ηλεκτρομυογρ[αά]φ","ηλεκτροκαρδιογρ[αά]φ",
  "ακου[οό]γραμμ","πανοραμικ","βιοψ[ιί]","ψυχομετρικ","καταρρακτ","γλαύκωμα","γλαυκωμα",
  "βυθοσκοπ","επιχρισμ","προστατ[ηή]","καρκιν","νεοπλασ[ιί]","κολπικ[οό]","διακολπικ",
  "αρτηριογραφ","υπερτασιολογικ"
];
const TERM_RE = new RegExp(
  "[\\u0370-\\u03FFA-Za-z]*(?:" + [...SPECIALTY_STEMS, ...EXAM_WORDS].join("|") + ")[\\u0370-\\u03FF]*",
  "giu"
);
function highlightExamTerms(text){
  if(!text) return "";
  let result = "", lastIndex = 0, m;
  TERM_RE.lastIndex = 0;
  while((m = TERM_RE.exec(text)) !== null){
    if(m.index === TERM_RE.lastIndex) TERM_RE.lastIndex++;
    result += esc(text.slice(lastIndex, m.index));
    result += `<span class="exam-hl">${esc(m[0])}</span>`;
    lastIndex = TERM_RE.lastIndex;
  }
  result += esc(text.slice(lastIndex));
  return result;
}
function formatDetail(s){
  if(!s) return "";
  let t = s.toString()
    .replace(/\. (?=[Α-ΩA-Zα-ωa-z0-9])/g, ".\n")
    .replace(/, (?=[Α-Ω][α-ωΑ-Ω]{2,}\s?(?:\d|τηλ|Τηλ))/g, "\n");
  return highlightExamTerms(t).replace(/(\d{4,}(?:[-–/]\d+)*)/g, '<b class="ph">$1</b>');
}

const QUERY_STOPWORDS = new Set([
  "ΡΑΝΤΕΒΟΥ","ΝΟΣΟΚΟΜΕΙΟ","ΝΟΣΟΚΟΜΕΙΟΥ","ΝΟΣΟΚΟΜΕΙΑ","ΕΞΕΤΑΣΗ","ΕΞΕΤΑΣΕΙΣ",
  "ΤΗΛΕΦΩΝΟ","ΤΗΛΕΦΩΝΑ","ΤΗΛ","ΙΑΤΡΕΙΟ","ΙΑΤΡΕΙΑ","ΚΛΙΝΙΚΗ","ΚΛΙΝΙΚΕΣ",
  "ΓΕΝΙΚΟ","ΓΕΝΙΚΗ","ΓΙΑ","ΣΤΟ","ΣΤΗΝ","ΚΑΙ","ΤΟΥ","ΤΗΣ","ΠΛΗΡΟΦΟΡΙΕΣ","ΠΛΗΡΟΦΟΡΙΑ",
  "ΜΕΤΑ","ΟΠΟΥ","ΑΠΟ","ΜΟΝΟ","ΕΙΝΑΙ","ΚΑΘΕ","ΠΟΥ","ΜΕΣΩ","ΔΕΝ","ΜΕΧΡΙ","ΠΕΝΤΕ",
  "ΤΡΙΑ","ΤΕΣΣΕΡΑ","ΕΞΙ","ΕΦΤΑ","ΟΚΤΩ","ΕΝΝΙΑ","ΔΕΚΑ","ΕΝΑ","ΜΙΑ","ΑΥΤΟ","ΑΥΤΗ",
  "ΕΧΕΙ","ΕΧΟΥΝ","ΙΔΙΟ","ΙΔΙΑ","ΤΟΤΕ","ΠΡΙΝ","ΚΑΤΑ","ΠΑΡΑ","ΩΣΤΕ","ΑΛΛΑ","ΟΣΟΝ",
  "ΑΦΟΡΑ","ΤΟΝ","ΤΗΝ","ΤΙΣ","ΤΟΝΣ"
]);
function stripStopwords(words){
  const kept = words.filter(w => !QUERY_STOPWORDS.has(normalize(w)));
  return kept.length ? kept : words; // never end up with an empty query
}

// A short, CURATED list of real Greek noun-ending alternations (nominative vs genitive,
// singular and plural) — Χανιά/Χανίων, Σέρρες/Σερρών, Ρόδος/Ρόδου, Λαμία/Λαμίας. Each pair
// only fires on an EXACT stem match after removing a known suffix, so — unlike proportional
// prefix/stem guessing — it can never let two unrelated words collide.
const DECLENSION_SUFFIX_PAIRS = [["Α","ΩΝ"], ["ΕΣ","ΩΝ"], ["Α","ΑΣ"], ["ΟΣ","ΟΥ"], ["Η","ΗΣ"],["ΟΣ","ΟΙ"],["ΟΣ","ΟΥΣ"]];
function declensionMatch(a, b){
  for(const [s1, s2] of DECLENSION_SUFFIX_PAIRS){
    if(a.endsWith(s1) && b.endsWith(s2) && a.slice(0, -s1.length) === b.slice(0, -s2.length)) return true;
    if(a.endsWith(s2) && b.endsWith(s1) && a.slice(0, -s2.length) === b.slice(0, -s1.length)) return true;
  }
  return false;
}

// ---- The whole search, in one rule ----
// A record matches when EVERY meaningful word of the query is found SOMEWHERE across that
// record's own fields (hospital + exam + detail + ΥΠΕ + appointment-schedule), combined
// into one piece of text. No mode-guessing (hospital vs exam vs region), no multi-branch
// interpretation of what the person "probably meant" — just: are these words all here.
// WHOLE-WORD matching only — no "is one word buried inside another" logic at all. That
// substring approach is exactly what kept causing false matches ("ιατρείο" sitting inside
// "οφθαλμιατρείο", "μετα" inside "μεταξά", "οπου" inside "κωνσταντοπούλειο" — none of them
// real relationships, just coincidental letter sequences). A word matches only if it is
// IDENTICAL to a whole word in the text, or differs from it only by a genuine Greek case
// ending (Ρόδος/Ρόδου, Λαμία/Λαμίας, Χανιά/Χανίων...).
function wordInText(qw, textWords){
  return textWords.some(tw => tw === qw || declensionMatch(tw, qw));
}
// One canonical form for the everyday exam names, so ΜΑΓΝΗΤΙΚΗ / ΜΑΓΝΗΤΙΚΟΣ / ΜΑΓΝΗΤΙΚΟ /
// ΜΑΓΝΗΤΙΚΕΣ (and ΑΞΟΝΙΚΗ/ΑΞΟΝΙΚΟΣ, ΥΠΕΡΗΧΟΣ/ΥΠΕΡΗΧΟΙ/ΥΠΕΡΗΧΟΓΡΑΦΗΜΑ ...) count as the same word.
// Still whole-word: only the word itself is converted, never a piece of another word.
const CANON_STEMS = [
  [/^ΜΑΓΝΗΤΙΚ[Α-ΩA-Z]*$|^ΜΑΓΝΗΤΗΣ$/, "MRI"], [/^ΑΞΟΝΙΚ[Α-ΩA-Z]*$/, "CT"], [/^ΤΟΜΟΓΡΑΦ[Α-ΩA-Z]*$/, "TOMO"],
  [/^ΥΠΕΡΗΧ[Α-ΩA-Z]*$/, "US"], [/^ΜΑΣΤΟΓΡΑΦ[Α-ΩA-Z]*$/, "MAMMO"], [/^ΑΙΜΟΛΗΨ[Α-ΩA-Z]*$/, "BLOOD"],
  [/^ΑΚΤΙΝΟΓΡΑΦ[Α-ΩA-Z]*$/, "XRAY"], [/^ΣΠΙΝΘΗΡΟΓΡΑΦ[Α-ΩA-Z]*$/, "SCINT"], [/^ΚΑΡΔΙΟΛΟΓ[Α-ΩA-Z]*$/, "CARDIO"],
  [/^ΝΕΥΡΟΛΟΓ[Α-ΩA-Z]*$/, "NEURO"], [/^ΟΦΘΑΛΜΟΛΟΓ[Α-ΩA-Z]*$/, "OPHTH"], [/^ΓΥΝΑΙΚΟΛΟΓ[Α-ΩA-Z]*$/, "GYN"],
  [/^ΟΥΡΟΛΟΓ[Α-ΩA-Z]*$/, "URO"], [/^ΜΙΚΡΟΒΙΟΛΟΓ[Α-ΩA-Z]*$/, "MICRO"], [/^ΕΝΔΟΣΚΟΠ[Α-ΩA-Z]*$/, "ENDO"]
];
const CANON_TOKENS = new Set(CANON_STEMS.map(x => x[1]));
function canonWord(w){
  if(w === "ΑΤΤΙΚΟ" || w === "ΑΤΤΙΚΟΥ") return "ΑΤΤΙΚΟΝ";   // Αττικό = Αττικόν (the hospital)
  for(const [re, to] of CANON_STEMS) if(re.test(w)) return to;
  return w;
}
function combinedWords(r){
  const text = normalize([r.hospital, r.exam, r.detail, r.ype, r.apptSchedule].filter(Boolean).join(" "));
  // Split on punctuation too (hyphens, parentheses, quotes, slashes, commas), not just
  // whitespace — so a hyphenated compound name like "Σισμανόγλειο-Αμαλία" becomes two real,
  // separately matchable whole words instead of one fused token.
  return text.split(/[\s\-\/,"().<>&\'`´‘’“”«»:;]+/).filter(Boolean).map(canonWord);
}
function fieldWords(s){
  return normalize(s || "").split(/[\s\-\/,"().<>&\'`´‘’“”«»:;]+/).filter(Boolean).map(canonWord);
}
function recordMatches(r, queryWords){
  const tw = combinedWords(r);
  return queryWords.every(qw => wordInText(qw, tw));
}

let query = "";

// Field-aware search. Words that name a hospital or area must be found in the hospital name
// (or ΥΠΕ) of the record — never in some other hospital's free text (a contact name, "ΑΘΗΝΩΝ"
// mentioned in passing...). Words about the exam must be found in the exam name or its note.
// A hospital's long general note is shown only when nothing more specific exists for the query.
const STEM_PREFIXES = {MRI:"ΜΑΓΝΗΤΙΚ",CT:"ΑΞΟΝΙΚ",TOMO:"ΤΟΜΟΓΡΑΦ",US:"ΥΠΕΡΗΧ",MAMMO:"ΜΑΣΤΟΓΡΑΦ",BLOOD:"ΑΙΜΟΛΗΨ",XRAY:"ΑΚΤΙΝΟΓΡΑΦ",SCINT:"ΣΠΙΝΘΗΡΟΓΡΑΦ",CARDIO:"ΚΑΡΔΙΟΛΟΓ",NEURO:"ΝΕΥΡΟΛΟΓ",OPHTH:"ΟΦΘΑΛΜΟΛΟΓ",GYN:"ΓΥΝΑΙΚΟΛΟΓ",URO:"ΟΥΡΟΛΟΓ",MICRO:"ΜΙΚΡΟΒΙΟΛΟΓ",ENDO:"ΕΝΔΟΣΚΟΠ"};
function searchRecords(words, prefixMode){
  const isP = w => prefixMode && w.length >= 3 && !CANON_TOKENS.has(w);
  const wm = (w, tw) => {
    if(wordInText(w, tw)) return true;
    if(!isP(w)) return false;
    if(tw.some(x => x.startsWith(w))) return true;
    return Object.keys(STEM_PREFIXES).some(k => STEM_PREFIXES[k].startsWith(w) && tw.includes(k));
  };
  const recs = allRecords();
  const vocab = new Set();
  const cache = new Map();
  recs.forEach(r => {
    const L = fieldWords([r.hospital, r.ype, r.area].filter(Boolean).join(" "));
    const X = fieldWords(r.exam);
    const D = fieldWords([r.detail, r.apptSchedule].filter(Boolean).join(" "));
    cache.set(r, {L, X, D});
    L.forEach(w => { if(!CANON_TOKENS.has(w)) vocab.add(w); });
  });
  const isHospWord = w => !CANON_TOKENS.has(w) && (vocab.has(w) || [...vocab].some(v => declensionMatch(v, w) || (isP(w) && v.startsWith(w))));
  const H = words.filter(isHospWord);
  const E = words.filter(w => !isHospWord(w));
  const atomic = [], general = [], generalByHosp = [];
  recs.forEach(r => {
    const f = cache.get(r);
    if(r.exam || r.cat !== "map"){
      if(H.every(w => wm(w, f.L) || wm(w, f.X)) &&
         E.every(w => wm(w, f.X) || wm(w, f.L) || wm(w, f.D))) atomic.push(r);
    } else {
      const hospOk = H.length === 0 || H.every(w => wm(w, f.L));
      const examOk = E.every(w => wm(w, f.L) || wm(w, f.D));
      if(hospOk && examOk) general.push(r);
      if(hospOk) generalByHosp.push(r);
    }
  });
  if(H.length === 0){
    // exam-only question: show the specific records; use the hospitals' general notes only as a fallback
    return atomic.length ? atomic : general;
  }
  if(E.length === 0) return atomic.concat(general);
  // hospital + exam: specific records first; the hospital's general note only feeds its schedule box
  if(!atomic.length) return general;
  const atomicHosp = new Set(atomic.map(r => r.hospital));
  const boxRecs = generalByHosp.filter(r => atomicHosp.has(r.hospital));
  general.forEach(r => { if(!boxRecs.includes(r)) boxRecs.push(r); });
  return atomic.concat(boxRecs.map(r => Object.assign({}, r, {_boxOnly: true})));
}

function render(){
  const contentEl = document.getElementById("content");
  const trimmed = query.trim();
  if(!trimmed){
    contentEl.innerHTML = `<div class="empty">
      <svg class="empty-illus" viewBox="0 0 260 170" fill="none">
        <g stroke="#9FC2B8" stroke-width="2">
          <line x1="130" y1="95" x2="40" y2="30"/>
          <line x1="130" y1="95" x2="80" y2="20"/>
          <line x1="130" y1="95" x2="30" y2="80"/>
          <line x1="130" y1="95" x2="25" y2="130"/>
          <line x1="130" y1="95" x2="220" y2="30"/>
          <line x1="130" y1="95" x2="180" y2="18"/>
          <line x1="130" y1="95" x2="230" y2="80"/>
          <line x1="130" y1="95" x2="235" y2="130"/>
        </g>
        <circle cx="40" cy="30" r="12" fill="#3B6E71"/>
        <circle cx="80" cy="20" r="9" fill="#C08A2E"/>
        <circle cx="30" cy="80" r="10" fill="#2A4A42"/>
        <circle cx="25" cy="130" r="11" fill="#3B6E71"/>
        <circle cx="220" cy="30" r="10" fill="#B23A2E"/>
        <circle cx="180" cy="18" r="9" fill="#2A4A42"/>
        <circle cx="230" cy="80" r="12" fill="#3B6E71"/>
        <circle cx="235" cy="130" r="9" fill="#C08A2E"/>
        <rect x="95" y="60" width="70" height="48" rx="4" fill="#2A4A42"/>
        <rect x="101" y="66" width="58" height="34" rx="2" fill="#EFF3EF"/>
        <rect x="122" y="108" width="16" height="10" fill="#2A4A42"/>
        <rect x="108" y="118" width="44" height="6" rx="3" fill="#B6C4BE"/>
        <circle cx="130" cy="140" r="11" fill="#F3D8B6"/>
        <path d="M112 166c2-12 8-18 18-18s16 6 18 18" fill="#3B6E71"/>
      </svg>
      Γράψε ένα νοσοκομείο, μια εξέταση, ή και τα δύο μαζί (π.χ. "Ευαγγελισμός Triplex").
    </div>`;
    return;
  }

  const GENERAL_ASK_RE = /ΓΕΝΙΚ[Α-Ω]*\s+ΠΛΗΡΟΦΟΡΙ[Α-Ω]*/g;
  const wantsGeneral = GENERAL_ASK_RE.test(normalize(trimmed));
  GENERAL_ASK_RE.lastIndex = 0;
  const baseText = wantsGeneral ? normalize(trimmed).replace(GENERAL_ASK_RE, " ") : trimmed;
  const words = stripStopwords(normalize(baseText).split(/[\s\-\/,"().<>&\'`´‘’“”«»:;]+/).filter(Boolean));
  if(wantsGeneral && words.length === 0){
    contentEl.innerHTML = `<div class="empty">Γράψε και το όνομα του νοσοκομείου, π.χ. "Άγιος Σάββας γενικές πληροφορίες".</div>`;
    return;
  }
  let results = searchRecords(words.map(canonWord));
  if(results.length === 0) results = searchRecords(words.map(canonWord), true);

  if(results.length === 0){
    contentEl.innerHTML = `<div class="empty">Δεν βρέθηκε τίποτα για "${esc(query)}". Δοκίμασε πιο απλή αναζήτηση.</div>`;
    return;
  }

  // Three tiers: (0) records already surfaced in a green appt-schedule box, (1) anything
  // else that talks about ραντεβού/scheduling in general — not tied to one specific exam —
  // so it reads right after the green boxes, and (2) everything else (specific exams/clinics).
  // Within a tier, group by hospital so a search that hits several exams at the same
  // hospital reads as one block, with each hospital's general record first.
  const GENERAL_SCHEDULE_RE_SORT = /έκδοσης προγράμματος|ραντεβού.*γενικ|γενικ.*ραντεβού|ημερομηνί.*ραντεβού/iu;
  function apptTier(r){
    if(!r.exam && r.apptSchedule) return 0;
    if(!r.apptSchedule && r.exam && GENERAL_SCHEDULE_RE_SORT.test(r.exam)) return 0;
    const examIsAppt = r.exam && /ραντεβ/iu.test(r.exam);
    const detailIsAppt = !r.exam && r.detail && !r.apptSchedule && /ραντεβ/iu.test(r.detail);
    return (examIsAppt || detailIsAppt) ? 1 : 2;
  }
  results.sort((a, b) => {
    const ta = apptTier(a), tb = apptTier(b);
    if(ta !== tb) return ta - tb;
    const byHosp = (a.hospital||"").localeCompare(b.hospital||"", "el");
    if(byHosp !== 0) return byHosp;
    const aGeneral = !a.exam, bGeneral = !b.exam;
    if(aGeneral !== bGeneral) return aGeneral ? -1 : 1;
    return (a.exam||"").localeCompare(b.exam||"", "el");
  });

  const GENERAL_SCHEDULE_RE = /έκδοσης προγράμματος|ραντεβού.*γενικ|γενικ.*ραντεβού|ημερομηνί.*ραντεβού/iu;
  const isGeneralScheduleRow = r => !r.apptSchedule && r.exam && GENERAL_SCHEDULE_RE.test(r.exam);

  const generalBoxes = results
    .filter(r => !r.exam && r.apptSchedule)
    .map(r => `
      <div class="appt-box">
        <div class="appt-box-label">📅 Πότε βγαίνει το πρόγραμμα ραντεβού — ${esc(r.hospital)}</div>
        <div class="appt-box-body">${formatDetail(r.apptSchedule)}</div>
      </div>`).join("")
    + results
      .filter(isGeneralScheduleRow)
      .map(r => `
      <div class="appt-box">
        <div class="appt-box-label">📅 Πότε βγαίνει το πρόγραμμα ραντεβού — ${esc(r.hospital || "—")}</div>
        <div class="appt-box-body">${formatDetail(r.detail)}</div>
      </div>`).join("");

  // Clinic-level "when do appointments open" rows (flagged sched:true in the data) go into a
  // box per hospital too, instead of sitting among the ordinary result rows.
  const schedGroups = {};
  results.filter(r => r.sched).forEach(r => { (schedGroups[r.hospital || "—"] = schedGroups[r.hospital || "—"] || []).push(r); });
  const schedBoxes = Object.keys(schedGroups).map(h => `
      <div class="appt-box">
        <div class="appt-box-label">📅 Πότε ανοίγουν τα ραντεβού — ${esc(h)}</div>
        <div class="appt-box-body">${schedGroups[h].map(r => `<div style="margin-top:4px"><b>${esc(r.exam)}:</b> ${formatDetail(r.detail)}</div>`).join("")}</div>
      </div>`).join("");

  // A hospital's long general note is shown only when asked for ("... γενικές πληροφορίες"),
  // unless the hospital has nothing more specific in the results (then it is all there is).
  const isGenRec = r => !r.exam && r.cat === "map";
  const hospWithSpecific = new Set(results.filter(r => !isGenRec(r) && !r._boxOnly).map(r => r.hospital));
  const visible = results.filter(r => !isGeneralScheduleRow(r) && !r.sched && !r._boxOnly)
    .filter(r => wantsGeneral ? isGenRec(r) : !(isGenRec(r) && hospWithSpecific.has(r.hospital)));
  const rows = visible.map(r => {
    const secondary = r.exam || "";
    return `
      <div class="row-item${apptTier(r)===1 ? ' appt-row' : ''}">
        <div class="h">${esc(r.hospital || "—")}${secondary ? ` <span class="ex">— ${esc(secondary)}</span>` : ""} ${r.custom ? `<span class="badge" style="background:#F3E9F4;color:#8B4B8C">δικό σου</span>` : ""}</div>
        ${r.detail ? `<div class="d">${formatDetail(r.detail)}</div>` : ""}
        ${r.custom ? `<button class="del" data-id="${r.id}">Διαγραφή</button>` : ""}
      </div>`;
  }).join("");

  contentEl.innerHTML = `<div class="detail-card">
    <div class="detail-title">${esc(query)}</div>
    <div class="detail-sub">${visible.length} αποτελέσμα${visible.length===1?'':'τα'}</div>
    ${generalBoxes}
    ${schedBoxes}
    <div class="section-label">Αποτελέσματα</div>
    ${rows}
  </div>`;

  contentEl.querySelectorAll(".del").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      customEntries = customEntries.filter(e=>e.id !== btn.dataset.id);
      persist();
      render();
    });
  });
}

document.getElementById("search").addEventListener("input", e => { query = e.target.value; render(); });

// ---- add form ----
const addToggle = document.getElementById("addToggle");
const formHolder = document.getElementById("formHolder");
let formOpen = false;
function renderForm(){
  if(!formOpen){ formHolder.innerHTML=""; addToggle.style.display="flex"; return; }
  addToggle.style.display = "none";
  formHolder.innerHTML = `<div class="form">
    <button class="close" id="closeForm">✕</button>
    <h3>Νέα καταχώρηση</h3>
    <div class="form-grid">
      <input id="f_hospital" placeholder="Νοσοκομείο *">
      <input id="f_exam" placeholder="Εξέταση / Τμήμα / Ιατρείο">
      <input id="f_ype" placeholder="ΥΠΕ / Περιοχή">
      <input id="f_phone" placeholder="Τηλέφωνο">
    </div>
    <textarea id="f_detail" rows="2" placeholder="Σημειώσεις / λεπτομέρειες ραντεβού..."></textarea>
    <button class="save" id="f_save">Αποθήκευση καταχώρησης</button>
  </div>`;
  document.getElementById("closeForm").addEventListener("click", ()=>{ formOpen=false; renderForm(); });
  document.getElementById("f_save").addEventListener("click", ()=>{
    const hospital = document.getElementById("f_hospital").value.trim();
    const exam = document.getElementById("f_exam").value.trim();
    const ype = document.getElementById("f_ype").value.trim();
    const phone = document.getElementById("f_phone").value.trim();
    const notes = document.getElementById("f_detail").value.trim();
    if(!hospital && !exam) return;
    const detail = [phone, notes].filter(Boolean).join(" — ");
    customEntries = [{ cat: exam ? "custom" : "map", ype, exam, hospital, detail, custom:true, id: Date.now().toString() }, ...customEntries];
    persist();
    formOpen = false;
    renderForm();
    render();
  });
}
addToggle.addEventListener("click", ()=>{ formOpen=true; renderForm(); });

renderForm();
document.getElementById("content").innerHTML = `<div class="empty">Φόρτωση δεδομένων...</div>`;
loadSeedData().then((status) => {
  if(!status.ok){
    console.warn("Could not load live sheet data, using bundled snapshot.", status.error);
  }
  render();
});
</script>

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
