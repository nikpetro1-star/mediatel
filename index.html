<script>
function normalize(str) {
  return (str || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
}

function extractPhones(text) {
  if (!text) return [];
  const matches = text.match(/(?:2\d{2,4}[- ]?\d{5,7}|1535|1566|14500|14960|14741|69\d{8})/g);
  if (!matches) return [];
  const clean = matches.map(m => m.replace(/[- ]/g, '')).filter(m => m.length >= 4);
  return Array.from(new Set(clean));
}

function extractSchedule(text) {
  if (!text) return null;
  const match = text.match(/(?:Έκδοση Προγράμματος|Ενημέρωση Προγράμματος|Πρόγραμμα|αναρτώνται|δίνονται|ανοίγουν|Έκδοση ρβ|Εκδοση προγραμματος)\s*:?\s*([^.–\n]+)/i);
  return match ? match[1].trim() : null;
}

"exam": "Παχυσαρκίας ιατρείο - διεύθυνση", "ype": "", "detail": "Αναφορά σε γιατρό Ξεβασιλόπουλος - είναι η διεύθυνση του Λαϊκού, όχι προσωπικό ιατρείο", "cat": "notebook"}, {"id": "786", "hospital": "ΡΙΟ", "exam": "Κλινική Παθολογίας", "ype": "", "detail": "Λοιμώδη Νοσήματα", "cat": "notebook"}];

let database = RAW_SNAPSHOT.map(item => ({
  ...item,
  phones: extractPhones(item.detail),
  scheduleRule: extractSchedule(item.detail)
}));

const STORAGE_KEY = "callcenter_custom_db_v3";
let customEntries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

function getAllRecords() {
  return [...customEntries, ...database];
}

const STOP_WORDS = new Set([
  "ΠΟΤΕ", "ΑΝΟΙΓΟΥΝ", "ΑΝΟΙΓΕΙ", "ΤΑ", "ΤΟ", "ΤΟΝ", "ΤΗΝ", "ΤΗΣ", "ΤΟΥ", 
  "ΡΑΝΤΕΒΟΥ", "ΣΤΟ", "ΣΤΟΝ", "ΣΤΗΝ", "ΣΤΟΥ", "ΓΙΝΕΤΑΙ", "ΕΧΕΙ", "ΓΙΑ", 
  "ΚΑΙ", "ΜΕ", "ΠΩΣ", "ΠΟΥ", "ΕΙΝΑΙ", "ΘΑ", "ΑΠΟ", "ΣΕ", "ΝΑ", "Ο", "Η"
]);

function smartSearch(queryText) {
  const q = normalize(queryText);
  if (!q) return [];

  const searchWords = q
    .split(/[\s,.;:!?/\\-]+/)
    .filter(w => w.length > 1 && !STOP_WORDS.has(w));

  if (searchWords.length === 0) return [];

  const allRecords = getAllRecords();

  const scored = allRecords.map(r => {
    const hospNorm = normalize(r.hospital);
    const examNorm = normalize(r.exam);
    const detailNorm = normalize(r.detail);
    const ypeNorm = normalize(r.ype);
    const fullText = `${hospNorm} ${examNorm} ${detailNorm} ${ypeNorm}`;

    let score = 0;
    let matchedCount = 0;

    for (const word of searchWords) {
      let matched = false;

      if (hospNorm.includes(word) || examNorm.includes(word)) {
        score += 20;
        matched = true;
      } else if (fullText.includes(word)) {
        score += 8;
        matched = true;
      } else {
        const stemLen = word.length > 5 ? 5 : (word.length >= 4 ? 4 : word.length);
        const stem = word.substring(0, stemLen);
        if (hospNorm.includes(stem) || examNorm.includes(stem)) {
          score += 12;
          matched = true;
        } else if (fullText.includes(stem)) {
          score += 4;
          matched = true;
        }
      }

      if (matched) matchedCount++;
    }

    return { record: r, score, matchedCount };
  });

  return scored
    .filter(item => item.matchedCount > 0)
    .sort((a, b) => {
      if (b.matchedCount !== a.matchedCount) {
        return b.matchedCount - a.matchedCount;
      }
      return b.score - a.score;
    })
    .slice(0, 50)
    .map(item => item.record);
}

function render() {
  const contentEl = document.getElementById("content");
  const query = document.getElementById("search").value;
  const results = smartSearch(query);

  if (!query.trim()) {
    contentEl.innerHTML = `
      <div class="empty">
        Πληκτρολογήστε ερώτημα όπως μιλάει ο πολίτης.
        <div class="hints">
          <button class="hint-btn" onclick="setQuery('πότε ανοίγουν τα ραντεβού Ιπποκράτειο Θεσσαλονίκης')">Ιπποκράτειο Θεσσαλονίκης (Ραντεβού)</button>
          <button class="hint-btn" onclick="setQuery('πότε ανοίγουν τα ραντεβού Ιπποκράτειο Αθήνας')">Ιπποκράτειο Αθήνας (Ραντεβού)</button>
          <button class="hint-btn" onclick="setQuery('σπινθηρογράφημα Βόλος')">Σπινθηρογράφημα Βόλος</button>
        </div>
      </div>`;
    return;
  }

  if (results.length === 0) {
    contentEl.innerHTML = `<div class="empty">Δεν βρέθηκαν αποτελέσματα. Δοκιμάστε με πιο απλούς όρους.</div>`;
    return;
  }

  contentEl.innerHTML = `
    <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">Βρέθηκαν ${results.length} ακριβείς καταχωρήσεις</div>
    ${results.map(r => renderCard(r)).join('')}
  `;
}

function renderCard(r) {
  const phonesHtml = r.phones && r.phones.length 
    ? r.phones.map(p => `<a href="tel:${p}" class="phone-link">📞 ${p}</a>`).join('')
    : '<span style="color:var(--muted); font-size:12px;">Δεν αναγράφεται απευθείας τηλέφωνο</span>';

  const title = r.hospital || r.exam || "Πληροφορία Νοσοκομείου";
  const tag = r.exam 
    ? `<span class="type-tag">${r.exam}</span>` 
    : (r.ype ? `<span class="type-tag" style="background:#EBF5F0;color:var(--primary)">${r.ype}</span>` : `<span class="type-tag" style="background:#EBF5F0;color:var(--primary)">Γενικές Πληροφορίες</span>`);

  return `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="hosp-name">${title}</div>
          ${r.ype && r.hospital ? `<div style="font-size:12px; color:var(--muted); margin-top:2px;">${r.ype}</div>` : ''}
        </div>
        ${tag}
      </div>

      <div class="info-grid">
        <div class="info-box">
          <strong>Τηλέφωνα Ραντεβού / Τμήματος</strong>
          <div>${phonesHtml}</div>
        </div>
        ${r.scheduleRule ? `
        <div class="info-box" style="background:#FFFCE8; border-color:#F5E6A3;">
          <strong style="color:#8A6D0B;">Πότε Ανοίγουν τα Ραντεβού</strong>
          <span style="font-weight:600; font-size:13px; color:#1E3932;">${r.scheduleRule}</span>
        </div>` : ''}
      </div>

      ${r.detail ? `<div class="detail-text">${r.detail}</div>` : ''}
    </div>
  `;
}

function setQuery(text) {
  document.getElementById("search").value = text;
  render();
}

document.getElementById("search").addEventListener("input", render);

const addToggle = document.getElementById("addToggle");
const formHolder = document.getElementById("formHolder");
let formOpen = false;

addToggle.addEventListener("click", () => {
  formOpen = !formOpen;
  if (!formOpen) { formHolder.innerHTML = ""; return; }
  formHolder.innerHTML = `
    <div class="form">
      <h3>Προσθήκη Νέας Πληροφορίας</h3>
      <input id="f_hosp" placeholder="Όνομα Νοσοκομείου & Πόλη *">
      <input id="f_exam" placeholder="Εξέταση / Τμήμα">
      <input id="f_ype" placeholder="ΥΠΕ">
      <textarea id="f_detail" rows="3" placeholder="Σημειώσεις, τηλέφωνα, πότε ανοίγουν τα ραντεβού..."></textarea>
      <button onclick="saveEntry()">Αποθήκευση</button>
    </div>`;
});

function saveEntry() {
  const hosp = document.getElementById("f_hosp").value.trim();
  const exam = document.getElementById("f_exam").value.trim();
  const ype = document.getElementById("f_ype").value.trim();
  const detail = document.getElementById("f_detail").value.trim();

  if (!hosp && !exam && !detail) return;

  const newObj = {
    id: Date.now().toString(),
    hospital: hosp,
    exam: exam,
    ype: ype,
    detail: detail,
    phones: extractPhones(detail),
    scheduleRule: extractSchedule(detail),
    custom: true
  };

  customEntries.unshift(newObj);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(customEntries));
  formOpen = false;
  formHolder.innerHTML = "";
  render();
}

render();
</script>
