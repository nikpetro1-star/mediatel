<style>
  :root {

  * { box-sizing: border-box; }

  h1 { font-family:'Fraunces',serif; font-size:24px; margin:0; color:var(--ink); font-weight:600; }
  .modes { display:flex; gap:8px; margin-top:14px; }
  .mode { flex:1; padding:10px; border-radius:10px; border:2px solid var(--border); background:white; font-size:13.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; color:var(--text); }
  .mode.active.exam { border-color:var(--teal); background:var(--teal); color:white; }
  .mode.active.hospital { border-color:var(--ink); background:var(--ink); color:white; }
  .mode.active.combo { border-color:var(--purple); background:var(--purple); color:white; }
  .modes .mode { flex:1; font-size:12.5px; padding:10px 4px; }
  .combo-box { display:flex; flex-direction:column; gap:8px; margin-top:10px; }

  .searchbox input:focus { outline:2px solid var(--ink); }
  .searchbox svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); }
  main { padding:16px 0 40px; }
  .suggestions { display:flex; flex-direction:column; gap:6px; }

  .sugg .n { color:var(--muted); font-size:12px; font-family:'IBM Plex Mono',monospace; }
  .empty { text-align:center; color:var(--muted); padding:40px 20px; font-size:14px; line-height:1.6; }

  .detail-card { background:white; border:1px solid var(--border); border-radius:12px; padding:18px; }
  .detail-title { font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--ink); margin:0 0 4px; }
  .detail-sub { font-size:12.5px; color:var(--muted); margin-bottom:14px; }
  .section-label { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:600; margin:16px 0 8px; }
  .section-label:first-of-type { margin-top:0; }
  .row-item { border-top:1px solid var(--border); padding:12px 0; }
  .row-item:first-child { border-top:none; padding-top:0; }
  .row-item + .row-item { margin-top:2px; }
  .row-item .h { font-weight:600; font-size:14px; color:var(--text); }
  .row-item .d { font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text); white-space:pre-wrap; margin-top:3px; line-height:1.5; }
  .badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:999px; margin-left:6px; vertical-align:middle; font-weight:600; }
  .addbtn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:10px; border-radius:10px; border:2px dashed var(--purple); color:var(--purple); background:transparent; font-size:13.5px; font-weight:500; cursor:pointer; margin:14px 0 0; }

  .form { background:white; border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:12px; }
  .form h3 { font-family:'Fraunces',serif; color:var(--ink); margin:0 0 12px; font-size:16px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form input, .form textarea { border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:14px; width:100%; font-family:inherit; }
  .form textarea { margin-top:10px; resize:vertical; }
  .form .save { margin-top:12px; background:var(--ink); color:white; border:none; padding:9px 16px; border-radius:6px; font-size:14px; font-weight:500; cursor:pointer; }
  .form .close { float:right; background:none; border:none; cursor:pointer; color:var(--muted); }
  .del { background:none; border:none; cursor:pointer; color:var(--accent); padding:2px 6px; border-radius:4px; font-size:11px; }
  .del:hover { background:#FBEAE8; }
</style>

function parseCSV(text){
  // Minimal RFC4180-ish CSV parser (handles quoted fields with commas/newlines/escaped quotes).
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] && r[0].trim()));
}

function csvRowsToRecords(rows){
  if(rows.length < 2) return [];
  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = (name) => header.indexOf(name);
  const iCat = idx("category"), iYpe = idx("ype"), iExam = idx("exam"), iHosp = idx("hospital"), iDet = idx("detail");
  return rows.slice(1).map(r => ({
    cat: iCat >= 0 ? (r[iCat]||"").trim() : "",
    ype: iYpe >= 0 ? (r[iYpe]||"").trim() : "",
    exam: iExam >= 0 ? (r[iExam]||"").trim() : "",
    hospital: iHosp >= 0 ? (r[iHosp]||"").trim() : "",
    detail: iDet >= 0 ? (r[iDet]||"").trim() : "",
  })).filter(r => r.hospital || r.exam);
}

async function loadSeedData(){
  if(!SHEET_CSV_URL){
    SEED_DATA = BUNDLED_SNAPSHOT;
    return { ok: true, source: "bundled" };
  }
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const records = csvRowsToRecords(parseCSV(text));
    if(records.length === 0) throw new Error("empty sheet");
    SEED_DATA = records;
    return { ok: true, source: "sheet" };
  } catch(e){
    SEED_DATA = BUNDLED_SNAPSHOT;
    return { ok: false, source: "bundled", error: e };
  }
}

const STORAGE_KEY = "hospital-registry-custom-entries";
let customEntries = [];
try { customEntries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch(e) { customEntries = []; }

function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(customEntries)); }
function allRecords() { return customEntries.concat(SEED_DATA); }

const TRANSLIT = [[/ΤΡΙΠΛΕΞ/g,'TRIPLEX'],[/ΧΟΛΤΕΡ/g,'HOLTER'],[/ΝΤΟΠΛΕΡ/g,'DOPPLER'],[/DOOPLER/g,'DOPPLER']];
function normalize(s){
  let n = (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
  for(const [re,rep] of TRANSLIT) n = n.replace(re, rep);
  return n;
}
const STOP = new Set(["ΓΕΝΙΚΟ","ΝΟΣΟΚΟΜΕΙΟ","ΝΟΣΟΚΟΜΕΙΟΥ","ΠΑΝΕΠΙΣΤΗΜΙΑΚΟ","ΠΑΝΕΠΙΣΤΗΜΙΑΚΟΥ","ΠΑΙΔΩΝ","ΑΘΗΝΩΝ","ΠΕΙΡΑΙΑ","ΘΕΣΣΑΛΟΝΙΚΗΣ","Γ","Ν","Η","Ο","ΤΗΣ","ΤΟΥ"]);
function coreName(s){
  let n = normalize(s).replace(/[.'"()><\-]/g,' ').replace(/\s+/g,' ').trim();
  return n.split(' ').filter(w => w && !STOP.has(w)).join(' ').trim();
}
function sameHospital(a,b){
  const ca = coreName(a), cb = coreName(b);
  if(!ca || !cb) return false;
  if(ca === cb) return true;

  // Whole-string containment (handles declension: "Ρόδος"/"Ρόδου") — only trusted when
  // the shorter side is long enough that it can't hide by coincidence inside an unrelated
  // word (e.g. the 2-letter abbreviation "ΚΥ" sits literally inside "ΖΑΚΥΝΘΟΣ").
  const shorter = ca.length <= cb.length ? ca : cb;
  const longer  = ca.length <= cb.length ? cb : ca;
  if(shorter.length >= 5 && longer.includes(shorter)) return true;

  // Otherwise compare word-by-word: short words/abbreviations (ΚΑΤ, ΚΥ, ...) must match
  // EXACTLY; longer words may match by shared stem to stay declension-tolerant.
  const wordsA = ca.split(" ").filter(Boolean);
  const wordsB = cb.split(" ").filter(Boolean);
  return wordsA.some(wa => wordsB.some(wb => {
    if(wa.length < 4 || wb.length < 4) return wa === wb;
    return wa === wb || wa.includes(wb) || wb.includes(wa) || stem(wa) === stem(wb);
  }));
}
function esc(s){ return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
// Greek is heavily inflected (Ρόδος/Ρόδου, Λαμία/Λαμίας) so plain substring search
// misses valid matches. wordMatch compares word STEMS (prefixes) instead of exact forms.
function stem(w){ return w.length > 4 ? w.slice(0, 4) : w; }
function wordMatch(labelNorm, queryNorm){
  if(!queryNorm) return true;
  const qWords = queryNorm.split(/\s+/).filter(Boolean);
  // ignore tiny label words (articles/initials like "Ο","Η") that trivially match via includes()
  const lWords = labelNorm.split(/\s+/).filter(w => w.length >= 3);
  if(qWords.length === 0) return true;
  return qWords.every(qw => {
    if(qw.length < 3) return lWords.some(lw => lw === qw);
    return lWords.some(lw => lw.includes(qw) || qw.includes(lw) || stem(lw) === stem(qw));
  });
}
function formatDetail(s){
  if(!s) return "";
  // break long runs into one line per sentence/clause so entries don't visually merge
  let t = s.toString()
    .replace(/\. (?=[Α-ΩA-Zα-ωa-z0-9])/g, ".\n")
    .replace(/, (?=[Α-Ω][α-ωΑ-Ω]{2,}\s?(?:\d|τηλ|Τηλ))/g, "\n");
  return esc(t);
}

// When a record's "detail" text is a long combined blob (multiple facts glued together)
// and we know what the person is actually searching for, keep only the clause(s) that
// mention it instead of dumping the whole blob. Short/already-focused text is left as is.
function trimDetailToQuery(detail, qNorm){
  if(!detail || !qNorm) return detail;
  if(detail.length <= 180) return detail;
  const clauses = detail.split(/(?<=[.,\n])\s*/).map(s => s.trim()).filter(Boolean);
  const hits = clauses.filter(c => wordMatch(normalize(c), qNorm));
  return hits.length ? hits.join(" ") : detail;
}

// ---- indices ----
function buildExamIndex(){
  const groups = {};
  allRecords().forEach(r=>{
    if(r.cat === 'map' || !r.exam) return;
    const key = normalize(r.exam);
    if(!groups[key]) groups[key] = { label: r.exam, records: [] };
    groups[key].records.push(r);
  });
  return groups;
}
function buildHospitalIndex(){
  const groups = {};
  allRecords().forEach(r=>{
    if(!r.hospital) return;
    const key = coreName(r.hospital);
    if(!key) return;
    if(!groups[key]) groups[key] = { label: r.hospital, records: [] };
    if(r.cat === 'map' || r.hospital.length > groups[key].label.length) groups[key].label = r.hospital;
    groups[key].records.push(r);
  });
  return groups;
}

let query = "";

// Figure out, from one free-text query, whether the person means a hospital, an exam,
// or both together — so they never have to pick a mode first.
function hospitalMatches(q){ return allRecords().filter(r => r.hospital && sameHospital(r.hospital, q)); }
function examMatchesWhole(q){
  const nq = normalize(q);
  return allRecords().filter(r => r.exam && wordMatch(normalize(r.exam), nq));
}

function interpretQuery(qRaw){
  const q = qRaw.trim();
  if(!q) return null;
  const words = q.split(/\s+/).filter(Boolean);

  // Try splitting a multi-word query into a hospital part + an exam part (either order).
  for(let i = 1; i < words.length; i++){
    const partA = words.slice(0, i).join(" ");
    const partB = words.slice(i).join(" ");
    if(hospitalMatches(partA).length && examMatchesWhole(partB).length){
      return { type: "combo", hospital: partA, exam: partB };
    }
    if(hospitalMatches(partB).length && examMatchesWhole(partA).length){
      return { type: "combo", hospital: partB, exam: partA };
    }
  }

  // Otherwise treat it as a single hospital-name search or a single exam-name search.
  if(hospitalMatches(q).length) return { type: "hospital", query: q };
  return { type: "exam", query: q };
}

function matchingKeys(index, q){
  return Object.keys(index).filter(k => {
    if(wordMatch(normalize(index[k].label), q) || k.includes(q)) return true;
    return index[k].records.some(r =>
      wordMatch(normalize(r.hospital||''), q) ||
      wordMatch(normalize(r.exam||''), q) ||
      wordMatch(normalize(r.ype||''), q) ||
      normalize(r.detail||'').includes(q)
    );
  });
}

function directResults(mode, q){
  // EXAM mode.
  // 1) Records that are specifically ABOUT this exam (r.exam matches) — shown in full.
  const direct = allRecords().filter(r => r.exam && wordMatch(normalize(r.exam), q));

  // 2) The big "Χαρτογράφηση" hospital-info blobs (cat "map") sometimes mention a specific
  //    exam in passing (e.g. "Υπέρηχοι (Τρίπλεξ): 2132058379") buried in a huge paragraph.
  //    Scan those blobs sentence-by-sentence and pull out ONLY the sentence(s) that actually
  //    mention the searched exam — never the whole blob.
  const extracted = [];
  allRecords().filter(r => r.cat === "map" && r.detail).forEach(r => {
    const sentences = r.detail.split(/(?<=[.,\n])\s*/).map(s => s.trim()).filter(s => s.length > 0);
    const hits = sentences.filter(s => wordMatch(normalize(s), q));
    if(hits.length){
      extracted.push({
        cat: "map-extract",
        hospital: r.hospital,
        exam: query,
        detail: hits.join(" "),
        custom: false
      });
    }
  });

  return direct.concat(extracted);
}

function renderDirectList(matches, mode, titleOverride, trimQuery){
  const contentEl = document.getElementById("content");
  if(matches.length === 0){
    contentEl.innerHTML = `<div class="empty">Δεν βρέθηκε τίποτα. Δοκίμασε διαφορετική λέξη.</div>`;
    return;
  }
  if(mode === "exam"){
    matches.sort((a,b) => (a.hospital||"").localeCompare(b.hospital||"", "el"));
  } else {
    matches.sort((a,b) => {
      const byHosp = (a.hospital||"").localeCompare(b.hospital||"", "el");
      if(byHosp !== 0) return byHosp;
      return (a.exam||"").localeCompare(b.exam||"", "el");
    });
  }
  const rows = matches.map(r => {
    const primary = mode === "exam" ? (r.hospital || "—") : (r.hospital || "—");
    const secondary = mode === "exam" ? r.exam : (r.exam || (r.ype ? r.ype : ""));
    const shownDetail = trimQuery ? trimDetailToQuery(r.detail, trimQuery) : r.detail;
    return `
      <div class="row-item">
        <div class="h">${esc(primary)} ${secondary ? `<span class="n" style="font-family:'IBM Plex Mono',monospace;font-weight:400;">— ${esc(secondary)}</span>` : ""} ${r.custom ? `<span class="badge" style="background:#F3E9F4;color:#8B4B8C">δικό σου</span>` : ""}</div>
        ${shownDetail ? `<div class="d">${formatDetail(shownDetail)}</div>` : ""}
        ${r.custom ? `<button class="del" data-id="${r.id}">Διαγραφή</button>` : ""}
      </div>`;
  }).join("");
  contentEl.innerHTML = `<div class="detail-card">
    <div class="detail-title">${esc(titleOverride || query)}</div>
    <div class="detail-sub">${matches.length} αποτελέσμα${matches.length===1?'':'τα'}</div>
    <div class="section-label">${mode === "exam" ? "Νοσοκομεία &amp; στοιχεία επικοινωνίας" : "Πληροφορίες &amp; εξετάσεις"}</div>
    ${rows}
  </div>`;
  contentEl.querySelectorAll(".del").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      customEntries = customEntries.filter(e=>e.id !== btn.dataset.id);
      persist();
      render();
    });
  });
}

function comboResults(hospitalQ, examQ){
  // Both boxes must match — this directly answers "does hospital X do exam Y?"
  const hasHosp = !!hospitalQ.trim();
  const hasExam = !!examQ.trim();
  if(!hasHosp && !hasExam) return null;
  const nExam = normalize(examQ);
  return allRecords().filter(r => {
    const hospOk = !hasHosp || (r.hospital && sameHospital(r.hospital, hospitalQ));
    const examOk = !hasExam || (r.exam && wordMatch(normalize(r.exam), nExam));
    return hospOk && examOk && (r.hospital || r.exam);
  });
}

function render(){
  const contentEl = document.getElementById("content");

  if(!query.trim()){
    contentEl.innerHTML = `<div class="empty">Γράψε ένα νοσοκομείο, μια εξέταση, ή και τα δύο μαζί (π.χ. "Ευαγγελισμός Triplex").</div>`;
    return;
  }

  const interpreted = interpretQuery(query);

  if(interpreted.type === "combo"){
    const matches = comboResults(interpreted.hospital, interpreted.exam);
    if(!matches || matches.length === 0){
      contentEl.innerHTML = `<div class="empty">Δεν βρέθηκε αυτός ο συνδυασμός. Δοκίμασε μόνο το νοσοκομείο ή μόνο την εξέταση.</div>`;
      return;
    }
    const title = `${interpreted.hospital} — ${interpreted.exam}`;
    renderDirectList(matches, "hospital", title, normalize(interpreted.exam));
    return;
  }

  if(interpreted.type === "hospital"){
    // Match on the record's actual hospital field (fuzzy, case/declension-tolerant) —
    // NOT on stray mentions buried inside some other hospital's notes. Show the FULL
    // profile untrimmed — the query IS the hospital, so nothing here is "off-topic".
    const matches = hospitalMatches(interpreted.query);
    renderDirectList(matches, "hospital", undefined, undefined);
    return;
  }

  // interpreted.type === "exam": show only the hospitals/lines relevant to this exam.
  const matches = directResults("exam", normalize(interpreted.query));
  renderDirectList(matches, "exam", undefined, normalize(interpreted.query));
}

document.getElementById("search").addEventListener("input", e => { query = e.target.value; render(); });

// ---- add form ----
const addToggle = document.getElementById("addToggle");
const formHolder = document.getElementById("formHolder");
let formOpen = false;
function renderForm(){
  if(!formOpen){ formHolder.innerHTML=""; addToggle.style.display="flex"; return; }
  addToggle.style.display = "none";
  formHolder.innerHTML = `<div class="form">
    <button class="close" id="closeForm">✕</button>
    <h3>Νέα καταχώρηση</h3>
    <div class="form-grid">
      <input id="f_hospital" placeholder="Νοσοκομείο *">
      <input id="f_exam" placeholder="Εξέταση / Τμήμα / Ιατρείο">
      <input id="f_ype" placeholder="ΥΠΕ / Περιοχή">
      <input id="f_phone" placeholder="Τηλέφωνο">
    </div>
    <textarea id="f_detail" rows="2" placeholder="Σημειώσεις / λεπτομέρειες ραντεβού..."></textarea>
    <button class="save" id="f_save">Αποθήκευση καταχώρησης</button>
  </div>`;
  document.getElementById("closeForm").addEventListener("click", ()=>{ formOpen=false; renderForm(); });
  document.getElementById("f_save").addEventListener("click", ()=>{
    const hospital = document.getElementById("f_hospital").value.trim();
    const exam = document.getElementById("f_exam").value.trim();
    const ype = document.getElementById("f_ype").value.trim();
    const phone = document.getElementById("f_phone").value.trim();
    const notes = document.getElementById("f_detail").value.trim();
    if(!hospital && !exam) return;
    const detail = [phone, notes].filter(Boolean).join(" — ");
    customEntries = [{ cat: exam ? "custom" : "map", ype, exam, hospital, detail, custom:true, id: Date.now().toString() }, ...customEntries];
    persist();
    formOpen = false;
    renderForm();
    render();
  });
}
addToggle.addEventListener("click", ()=>{ formOpen=true; renderForm(); });

renderForm();
document.getElementById("content").innerHTML = `<div class="empty">Φόρτωση δεδομένων...</div>`;
loadSeedData().then((status) => {
  if(!status.ok){
    console.warn("Could not load live sheet data, using bundled snapshot.", status.error);
  }
  render();
});
</script>
